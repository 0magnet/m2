{{ if ne ( .Page.WasmBinary | len) 0}}<script title='{{.Page.WasmExecPath}}' src='{{.Page.WasmExecRel}}'></script>
{{range .Page.WasmBinary}}
<script title='bolier-plate script to launch webassembly'>
(function() {
if (!WebAssembly.instantiateStreaming) {
		WebAssembly.instantiateStreaming = async (resp, importObject) => {
				const source = await (await resp).arrayBuffer();
				return await WebAssembly.instantiate(source, importObject);
		};
}
const go = new Go();
let mod, inst;
WebAssembly.instantiateStreaming(fetch("/{{.}}"), go.importObject).then((result) => {
		mod = result.module;
		inst = result.instance;
		run().then((result) => {
				console.log("Ran WASM: ", result)
		}, (failure) => {
				console.log("Failed to run WASM: ", failure)
		})
});
async function run() {
		await go.run(inst);
		inst = await WebAssembly.instantiate(mod, go.importObject);
}
})();
</script>
{{end}}
{{end}}
